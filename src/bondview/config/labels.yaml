# Bondview presentation labels and formatting templates.
#
# This file defines user-facing text and display formats only.
# It must not define data inputs, financial calculations, thresholds,
# or investment decision rules.
#
# Organization:
# - common: Shared terminology and display formats.
# - widgets: Labels for reusable interface components.
# - data: Labels for data-source reporting.
# - analyses: Presentation resources owned by each analysis.
#
# Add new analyses under analyses.<analysis_name>.
# Existing analysis sections should remain independent and unchanged.
# Shared entries should retain their meaning as new analyses are added.

common:
  na: N/A
  not_applicable: "—"

  units:
    percent_2dp: "{value:.2f}%"
    bp_signed_0dp: "{value:+.0f} bp"

  tenors:
    DGS2: 2Y
    DGS10: 10Y
    DGS30: 30Y

widgets:
  dates:
    start: Start
    end: End

data:
  fred:
    summary: "FRED observations ({mode})"
    summary_columns: "Series ID             Nonmissing"
    summary_row: "{series_id:<20} {count:>10,}"
    common: "Complete shared observations: {count:,}"
    mismatch: "FRED snapshot dates differ.\n{dates}\nLoading continues. Matching dates do not guarantee identical data vintages."

analyses:
  kw_decomposition:
    plot:
      titles:
        2Y: 2Y KW Decomposition
        10Y: 10Y KW Decomposition
      xaxis: Observation date
      level_axis: Level (%)
      change_axis: Change (bp)
      traces:
        fitted_yield: KW fitted yield
        expected_rate: Expected-rate component
        term_premium: Term premium
        expected_change_bp: Expected-rate change
        premium_change_bp: Term-premium change
      hover:
        levels_summary: >-
          KW fitted yield: %{y:.2f}%<br>
          Expected-rate component: %{customdata[0]:.2f}%<br>
          Term premium: %{customdata[1]:.2f}%
          <extra></extra>

        changes_summary: >-
          <b>Total KW fitted-yield change: %{customdata[0]:.0f} bp</b><br>
          Expected-rate change: %{y:.0f} bp<br>
          Term-premium change: %{customdata[1]:.0f} bp
          <extra></extra>

  treasury_curve:
    measures:
      DGS2: 2Y yield
      DGS10: 10Y yield
      DGS30: 30Y yield
      DGS10_DGS2: 10Y−2Y spread
      DGS30_DGS10: 30Y−10Y spread

    configuration:
      upward: Upward-sloping
      inverted: Inverted
      flat: Flat

    configuration_transition: "{start} → {end}"

    direction:
      rose: Yield rose
      fell: Yield fell
      unchanged: Little yield movement

    slope:
      unchanged: Little slope change
      steepening: Steepening
      flattening: Flattening

    movement:
      unchanged: Little yield movement
      parallel_up: Yields rose; little slope change
      parallel_down: Yields fell; little slope change
      bear: "Bear {slope}"
      bull: "Bull {slope}"
      twist: "Opposing-direction twist {slope}"
      short_only: "Short {direction}, other little change; {slope}"
      long_only: "Long {direction}, other little change; {slope}"

    table:
      measure: Treasury measure
      change: Change
      configuration: Curve configuration
      movement: Movement / regime

    interpretation:
      no_data: No tenor has observations at both effective endpoints. Yield movements are unavailable; choose another interval.
      upward: "Greatest upward yield movement among available tenors: {names} ({change})."
      downward: "Greatest downward yield movement among available tenors: {names} ({change})."
      unchanged: No tenor yield change exceeds the selected tolerance.
      partial: This comparison is partial because some endpoint observations are unavailable.
      segment: "{measure}: {movement}."
      qualification: These are net endpoint movements, not the full path or a forecast. #ETF rate-price effects depend on duration and other product characteristics.

    plot:
      title: U.S. Treasury constant-maturity yield history — FRED/H.15
      xaxis: Observation date
      yaxis: Yield (%)
      legend: Treasury tenor
      trace: "{tenor} ({series_id})"
      hover: "%{x|%Y-%m-%d}<br>%{y:.2f}%<extra>%{fullData.name}</extra>"

  conditional_scenarios:
    summary: >-
      Condition: {tenor} change [{lower:g}, {upper:g}] bp (inclusive).
      Horizon: {months} calendar months; endpoint step: {sampling_step_observations} complete observations.
      Complete reference history: {start} to {end}.
      Selected scenarios: {selected} / {eligible} eligible windows.
    qualification: >-
      Statistics are in bp. Overlapping intervals and marginal quantiles are
      descriptive, not independent event frequencies or forecast probabilities.
      Endpoints are sampled from the earliest complete date supporting the
      horizon, before conditioning. The step counts complete observations,
      not calendar days. Window endpoints are the first and last complete
      observations inside each intended calendar-month window. Windows
      with fewer than two observations or over seven days of combined endpoint
      shortfall are excluded.
    tenor_axis: Treasury tenor
    statistics:
      minimum: Minimum (bp)
      P10: P10 (bp)
      median: Median (bp)
      P90: P90 (bp)
      maximum: Maximum (bp)
    change: "Δ{tenor} (bp)"
    plot_title: Conditional historical joint Treasury yield changes
    fields:
      start_date: Historical start
      end_date: Historical end
      target_end_date: Calendar target
      elapsed_days: Elapsed days
